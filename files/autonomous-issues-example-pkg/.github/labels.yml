# Label vocabulary for the autonomous loop. Apply these with scripts/setup-labels.sh.
# Keep the set small and mostly disjoint so the PR board reads at a glance.

# --- Triggers (you apply these) ---
- name: agent
  color: "5319e7"
  description: "Opt this issue in to autonomous implementation by Claude"

# --- Lifecycle (automation applies these) ---
- name: in-progress
  color: "fbca04"
  description: "Claude has picked up the issue and is working"

- name: ci-failing
  color: "d73a4a"
  description: "CI is red; auto-fix is attempting a repair"

- name: conflict
  color: "b60205"
  description: "Branch conflicts with base; needs a rebase/merge resolution"

- name: needs-work
  color: "e99695"
  description: "Not yet green; still being worked by automation"

- name: ready-to-merge
  color: "0e8a16"
  description: "Green, conflict-free, marked ready — awaiting human approval + merge"

- name: human-needed
  color: "0052cc"
  description: "Automation gave up (e.g. 3 failed fix attempts); needs a person"

# Note: `autofix-attempt-1/2/3` labels are created on the fly by auto-fix-ci.yml
# to count repair attempts. You don't need to pre-create them.

# STAGE 3 of the loop: make the PR board self-documenting.
# After every CI run on an agent PR:
#   - CI success + no conflicts -> mark READY for review + label `ready-to-merge`.
#   - CI failure                -> send back to DRAFT + label `ci-failing`.
# Net effect on your PR board: every PR is either "ready for your approval" or a
# draft that's "still in progress." No ambiguous middle state.
#
# The human approval + merge is the ONLY manual step, and it's preserved by
# design: a bot cannot approve its own PR, so a required review can't be
# satisfied by automation. Keep "require 1 approval" in branch protection.
name: Claude · PR State Manager

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  set-state:
    # Only manage PRs from the base repo; leave fork PRs to normal human review.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FIXER_APP_ID }}
          private-key: ${{ secrets.FIXER_APP_PRIVATE_KEY }}

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            PR=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" \
                   --json number --jq '.[0].number' -R "${{ github.repository }}")
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Update state + labels
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$CONCLUSION" = "success" ]; then
            STATE=$(gh pr view "$PR" --json mergeStateStatus --jq '.mergeStateStatus')
            if [ "$STATE" = "CLEAN" ] || [ "$STATE" = "UNSTABLE" ]; then
              gh pr ready "$PR"
              gh pr edit "$PR" \
                --add-label "ready-to-merge" \
                --remove-label "ci-failing" \
                --remove-label "needs-work" \
                --remove-label "conflict" || true
              gh pr comment "$PR" --body "✅ Green and conflict-free. Ready for your review + merge."
            fi
          else
            gh pr ready "$PR" --undo || true
            gh pr edit "$PR" --add-label "ci-failing" --remove-label "ready-to-merge" || true
          fi

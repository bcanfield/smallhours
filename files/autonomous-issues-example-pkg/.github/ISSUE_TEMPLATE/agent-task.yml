name: "Agent task"
description: "A well-scoped task for Claude to implement autonomously"
title: "[agent] "
# NOTE: intentionally does NOT auto-apply the `agent` label. On a public repo,
# template labels are applied for ANY creator, which would let outsiders trigger
# the loop. A maintainer applies `agent` manually after reviewing the issue.
body:
  - type: markdown
    attributes:
      value: |
        Issue quality directly drives PR quality. The more concrete the
        acceptance criteria and the file hints, the better the result. A
        maintainer will add the `agent` label to hand this to Claude.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences on what should exist when this is done.
      placeholder: "Add a `median(numbers)` function to the stats module."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, testable bullet points.
      placeholder: |
        - Returns the median of an array of numbers
        - Handles even- and odd-length arrays
        - Throws on an empty array
        - Has tests covering the above
    validations:
      required: true

  - type: input
    id: files
    attributes:
      label: Likely files to touch
      description: Optional hint to point Claude at the right place.
      placeholder: "src/stats.js, test/stats.test.js"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes / constraints
      description: Anything else — edge cases, things to avoid, references.
    validations:
      required: false

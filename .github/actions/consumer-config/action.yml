# consumer-config — install the pinned yq and (optionally) fetch the consumer's
# .smallhours.yml into $RUNNER_TEMP/smallhours-config.yml.
#
# Referenced as `uses: ./.smallhours-toolkit/.github/actions/consumer-config`
# AFTER the toolkit self-checkout, so it always runs at the exact invoked
# toolkit version (job.workflow_sha) — no separate versioning surface. Replaces
# the step that was copy-pasted into every config-dependent job (paid debt
# config-fetch-step-duplicated).
#
# Jobs that check out the consumer repo itself pass fetch-config: 'false' and
# read .smallhours.yml from the workspace (lib/config.sh's default path); jobs
# without a consumer checkout fetch it via the API and export
# SMALLHOURS_CONFIG=$RUNNER_TEMP/smallhours-config.yml themselves.
name: consumer-config
description: Install pinned yq and fetch the consumer .smallhours.yml
inputs:
  token:
    description: Token used to read the consumer config via the API
    required: true
  fetch-config:
    description: Fetch .smallhours.yml into $RUNNER_TEMP/smallhours-config.yml
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install yq + fetch consumer config
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        FETCH_CONFIG: ${{ inputs.fetch-config }}
      run: |
        set -euo pipefail
        # versions.env sits at the toolkit root, three levels up from this action.
        . "${GITHUB_ACTION_PATH}/../../../versions.env"
        curl -fsSL -o "$RUNNER_TEMP/yq" \
          "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
        sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq
        if [ "$FETCH_CONFIG" = "true" ]; then
          gh api "repos/${GITHUB_REPOSITORY}/contents/.smallhours.yml" \
            --jq '.content' 2>/dev/null | base64 -d > "$RUNNER_TEMP/smallhours-config.yml" || true
        fi

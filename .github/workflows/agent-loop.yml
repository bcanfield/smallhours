# agent-loop — THE reusable workflow. Consumers call it from a thin stub:
#   jobs.loop.uses: bcanfield/smallhours/.github/workflows/agent-loop.yml@v1
#
# It routes each GitHub event to a portable script in scripts/ (the brains).
# This file is only the runtime adapter: mint the Fixer App token, check out the
# right repos, call the right script. All queue/routing logic upgrades behind
# the tag — the stub never changes (ADR 0002).
#
# WORK QUEUE (ADR 0005): `ready-for-agent` is an unbounded queue of validated
# issues; at most `max_concurrent` (.smallhours.yml, default 3) run at once. A
# dispatcher (idempotent reconciler, one global lock) promotes the oldest queued
# issues into free slots. Promotion sets `agent-working`, which re-triggers the
# implement route via the label-chain.
#
# Routing (DESIGN.md "Transitions"):
#   issues labeled ready-for-agent          -> authorize (validate + queue) -> dispatch
#   schedule / workflow_dispatch            -> dispatch (drain the queue) + sweep
#                                              (M7: T5 update-branch, T6 -> resolve-
#                                              conflict, watchdog, label healing)
#   issues labeled agent-working            -> implement (guarded: fresh, no open agent PR)
#   issues closed / unlabeled(agent-working, by a human) -> cancel  (T10 / T11)
#   pull_request_review changes_requested   -> address-review (T7)
#   pull_request_review approved/dismissed  -> reeval (green-gated T2 re-run — a
#                                              lingering changes-requested review
#                                              held the PR BLOCKED past its green)
#   pull_request closed unmerged (by a human, `agent` PR) -> cancel pr-closed (T9)
#   workflow_run completed (consumer CI)    -> state-manager (T2 / T3' / T4)
#                                              red + attempts left -> auto-fix
#
# Self-checkout: jobs that need the toolkit's own files check out
# ${{ job.workflow_repository }}@${{ job.workflow_sha }} — the EXACT version the
# consumer invoked (the floating v1 SHA), never drifting from the routing above.
# The consumer-config composite action rides that same checkout/version.
# (actionlint <= 1.7.x flags job.workflow_repository/workflow_sha as unknown; its
# schema is stale — these are documented job-context fields. Not a real error.)
name: agent-loop

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      AGENT_APP_ID:
        required: true
      AGENT_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  # ── T1 gate: validate the labeller, then QUEUE (dispatcher starts it later) ──
  authorize:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: smallhours-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      # Label mapping (ADR 0006 / 06-1): every job whose script touches labels
      # needs the consumer config so canonical names resolve.
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
      - id: gate
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SMALLHOURS_CONFIG: ${{ runner.temp }}/smallhours-config.yml
        run: |
          set -uo pipefail
          if .smallhours-toolkit/scripts/authorize.sh \
               "${{ github.event.issue.number }}" "${{ github.event.sender.login }}"; then
            echo "authorized=true"  >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Dispatcher (idempotent, one global lock) — promptly after a grant ───────
  dispatch_on_grant:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: smallhours-dispatch
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
      - name: Dispatch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SMALLHOURS_CONFIG: ${{ runner.temp }}/smallhours-config.yml
        run: .smallhours-toolkit/scripts/dispatch.sh

  # ── Dispatcher on the schedule tick (or a manual dispatch) — drains the queue
  dispatch_scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: smallhours-dispatch
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
      - name: Dispatch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SMALLHOURS_CONFIG: ${{ runner.temp }}/smallhours-config.yml
        run: .smallhours-toolkit/scripts/dispatch.sh

  # ── Sweep (M7): T5/T6 decisions, watchdog, label reconciliation ────────────
  # Decider only — no sandbox, no Claude. When it finds a DIRTY agent PR it
  # emits `conflict=<pr>` (at most one per tick) and the resolve_conflict job
  # below does the actual work, mirroring the ci_state -> auto_fix split.
  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: smallhours-sweep
      cancel-in-progress: false
    outputs:
      conflict_pr: ${{ steps.sw.outputs.conflict_pr }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
      - id: sw
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SMALLHOURS_CONFIG: ${{ runner.temp }}/smallhours-config.yml
        run: |
          set -euo pipefail
          out="$(.smallhours-toolkit/scripts/sweep.sh)"
          case "$out" in
            conflict=*) echo "conflict_pr=${out#conflict=}" >> "$GITHUB_OUTPUT" ;;
            *)          echo "conflict_pr="                 >> "$GITHUB_OUTPUT" ;;
          esac

  # ── T6 body: resolve the DIRTY agent PR the sweep picked; push re-runs CI ──
  resolve_conflict:
    needs: sweep
    if: needs.sweep.outputs.conflict_pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: smallhours-pr-${{ needs.sweep.outputs.conflict_pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      # The toolkit checkout lives inside the consumer worktree; keep `git add -A`
      # in the scripts from ever committing it (ADR 0005 bugfix).
      - name: Exclude the toolkit checkout from consumer commits
        run: echo '/.smallhours-toolkit/' >> "$GITHUB_WORKSPACE/.git/info/exclude"
      - name: Load pinned versions
        run: grep -E '^[A-Z_][A-Z0-9_]*=' .smallhours-toolkit/versions.env >> "$GITHUB_ENV"
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-config: 'false'
      - name: Provision sandbox (bubblewrap, Claude, managed settings)
        run: |
          set -euo pipefail
          source .smallhours-toolkit/scripts/lib/claude-run.sh
          claude_run_provision
      - name: Resolve the merge conflict, report usage
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          T=.smallhours-toolkit/scripts
          pr="${{ needs.sweep.outputs.conflict_pr }}"
          "$T/resolve-conflict.sh" "$pr"
          "$T/report-usage.sh" "$pr" "${RUNNER_TEMP}/smallhours-result.json" resolve_conflict
      - name: Upload give-up diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smallhours-resolve-conflict-result
          path: ${{ runner.temp }}/smallhours-result.json*
          if-no-files-found: ignore
          retention-days: 7

  # ── Guard: a fresh promotion (no open agent PR) vs an address-review re-summon
  implement_guard:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'agent-working'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.guard.outputs.go }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          issue="${{ github.event.issue.number }}"
          # Only a fresh dispatch has no agent PR. An address-review re-summon
          # (which also sets agent-working) already has one — skip implement.
          if gh pr list --repo "${{ github.repository }}" --state open --label agent \
               --json headRefName --jq '.[].headRefName' \
             | grep -Eq "^agent/issue-${issue}(-|$)"; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "issue #$issue already has an agent PR — not a fresh dispatch, skipping implement"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  # ── T1 body: implement on agent/issue-N, deterministic draft PR, usage ─────
  implement:
    needs: implement_guard
    if: needs.implement_guard.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: smallhours-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      # The toolkit checkout lives inside the consumer worktree; keep `git add -A`
      # in the scripts from ever committing it (ADR 0005 bugfix).
      - name: Exclude the toolkit checkout from consumer commits
        run: echo '/.smallhours-toolkit/' >> "$GITHUB_WORKSPACE/.git/info/exclude"
      - name: Load pinned versions
        run: grep -E '^[A-Z_][A-Z0-9_]*=' .smallhours-toolkit/versions.env >> "$GITHUB_ENV"
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-config: 'false'
      - name: Provision sandbox (bubblewrap, Claude, managed settings)
        run: |
          set -euo pipefail
          source .smallhours-toolkit/scripts/lib/claude-run.sh
          claude_run_provision
      - name: Implement, open draft PR, report usage
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          T=.smallhours-toolkit/scripts
          issue="${{ github.event.issue.number }}"
          branch="$("$T/implement.sh" "$issue")"
          pr="$("$T/open-pr.sh" "$issue" "$branch")"
          if [ -n "$pr" ]; then
            "$T/report-usage.sh" "$pr" "${RUNNER_TEMP}/smallhours-result.json" implement
          fi
      # On a give-up there is no PR, so report-usage never runs and the result
      # JSON + stderr die with the runner — the only record of what the agent
      # actually did. Keep them for a week so the run stays diagnosable.
      - name: Upload give-up diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smallhours-implement-result
          path: ${{ runner.temp }}/smallhours-result.json*
          if-no-files-found: ignore
          retention-days: 7

  # ── Cancellation: T10 (issue closed mid-run) / T11 (a HUMAN removed the state)
  # The sender.type == 'User' guard is essential: the App removes `agent-working`
  # on every normal transition (-> in-review / ready-for-human), and that must
  # NOT read as a cancellation. Only a human pulling the label is T11.
  cancel:
    if: >-
      github.event_name == 'issues' &&
      ( github.event.action == 'closed' ||
        ( github.event.action == 'unlabeled' &&
          github.event.label.name == 'agent-working' &&
          github.event.sender.type == 'User' ) )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: smallhours-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      # cancel.sh sets mappable state labels — needs the consumer config.
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SMALLHOURS_CONFIG: ${{ runner.temp }}/smallhours-config.yml
        run: |
          set -euo pipefail
          T=.smallhours-toolkit/scripts
          issue="${{ github.event.issue.number }}"
          if [ "${{ github.event.action }}" = "closed" ]; then
            # Only a mid-run close cancels. A normal merge closes from `in-review`.
            if gh issue view "$issue" --json labels --jq '.labels[].name' | grep -Fxq agent-working; then
              "$T/cancel.sh" issue-closed "$issue"
            else
              echo "issue #$issue is not agent-working — no cancellation."
            fi
          else
            "$T/cancel.sh" label-removed "$issue"
          fi

  # ── T9: a human closed an agent PR without merging — hand the issue back ───
  # sender.type gate mirrors T11: when cancel.sh itself closes a PR (T10/T11)
  # the resulting closed event comes from the App (Bot) and must not re-fire.
  # The `agent` literal is a fixed label (config.sh SMALLHOURS_FIXED_LABELS) —
  # expression-time gates cannot read the consumer config.
  pr_closed:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == false &&
      github.event.sender.type == 'User' &&
      contains(github.event.pull_request.labels.*.name, 'agent')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: smallhours-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SMALLHOURS_CONFIG: ${{ runner.temp }}/smallhours-config.yml
        run: .smallhours-toolkit/scripts/cancel.sh pr-closed "${{ github.event.pull_request.number }}"

  # ── T7: formal "Request changes" review re-summons the agent ───────────────
  address_review:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: smallhours-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      - name: Exclude the toolkit checkout from consumer commits
        run: echo '/.smallhours-toolkit/' >> "$GITHUB_WORKSPACE/.git/info/exclude"
      - name: Load pinned versions
        run: grep -E '^[A-Z_][A-Z0-9_]*=' .smallhours-toolkit/versions.env >> "$GITHUB_ENV"
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-config: 'false'
      - name: Provision sandbox (bubblewrap, Claude, managed settings)
        run: |
          set -euo pipefail
          source .smallhours-toolkit/scripts/lib/claude-run.sh
          claude_run_provision
      - name: Address the requested changes, report usage
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          T=.smallhours-toolkit/scripts
          pr="${{ github.event.pull_request.number }}"
          "$T/address-review.sh" "$pr" \
            "${{ github.event.review.state }}" "${{ github.event.review.user.login }}"
          "$T/report-usage.sh" "$pr" "${RUNNER_TEMP}/smallhours-result.json" address_review
      - name: Upload give-up diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smallhours-address-review-result
          path: ${{ runner.temp }}/smallhours-result.json*
          if-no-files-found: ignore
          retention-days: 7

  # ── T2 re-eval: an approval/dismissal unblocked a green agent PR (M7) ──────
  # A changes-requested review holds mergeStateStatus=BLOCKED when the green
  # revision's CI event runs state-manager, and the approval that later clears
  # it fires no workflow_run — this route closes that gap. Green-gated in
  # reeval.sh; red PRs stay with the auto-fix loop.
  review_reeval:
    if: >-
      github.event_name == 'pull_request_review' &&
      ( ( github.event.action == 'submitted' &&
          github.event.review.state == 'approved' ) ||
        github.event.action == 'dismissed' ) &&
      contains(github.event.pull_request.labels.*.name, 'agent')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: smallhours-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SMALLHOURS_CONFIG: ${{ runner.temp }}/smallhours-config.yml
        run: .smallhours-toolkit/scripts/reeval.sh "${{ github.event.pull_request.number }}"

  # ── T2 / T3' / T4: consumer CI outcome drives PR/issue state ───────────────
  # state-manager.sh decides; when it grants an auto-fix attempt it prints
  # `autofix=<n>` on stdout, which becomes this job's outputs for the auto_fix
  # job below.
  ci_state:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: smallhours-ci-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    outputs:
      autofix: ${{ steps.sm.outputs.autofix }}
      attempt: ${{ steps.sm.outputs.attempt }}
      pr: ${{ steps.sm.outputs.pr }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      # state-manager.sh sets mappable state/marker labels — needs the config.
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
      - id: sm
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SMALLHOURS_CONFIG: ${{ runner.temp }}/smallhours-config.yml
        run: |
          set -euo pipefail
          T=.smallhours-toolkit/scripts
          case "${{ github.event.workflow_run.conclusion }}" in
            success) ci=success ;;
            *)       ci=failure ;;
          esac
          pr="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$pr" ]; then
            pr="$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" \
                    --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          fi
          if [ -z "$pr" ]; then
            echo "No open PR for ${{ github.event.workflow_run.head_branch }} — nothing to do."
            exit 0
          fi
          decision="$("$T/state-manager.sh" "$pr" "$ci")"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          case "$decision" in
            autofix=*)
              echo "autofix=true"                >> "$GITHUB_OUTPUT"
              echo "attempt=${decision#autofix=}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "autofix=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # ── T3' body: fix the red CI on the agent PR; the push re-runs CI ──────────
  auto_fix:
    needs: ci_state
    if: needs.ci_state.outputs.autofix == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    concurrency:
      group: smallhours-pr-${{ needs.ci_state.outputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .smallhours-toolkit
      - name: Exclude the toolkit checkout from consumer commits
        run: echo '/.smallhours-toolkit/' >> "$GITHUB_WORKSPACE/.git/info/exclude"
      - name: Load pinned versions
        run: grep -E '^[A-Z_][A-Z0-9_]*=' .smallhours-toolkit/versions.env >> "$GITHUB_ENV"
      - uses: ./.smallhours-toolkit/.github/actions/consumer-config
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-config: 'false'
      - name: Provision sandbox (bubblewrap, Claude, managed settings)
        run: |
          set -euo pipefail
          source .smallhours-toolkit/scripts/lib/claude-run.sh
          claude_run_provision
      - name: Auto-fix the failing CI, report usage
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          T=.smallhours-toolkit/scripts
          pr="${{ needs.ci_state.outputs.pr }}"
          "$T/auto-fix.sh" "$pr" "${{ needs.ci_state.outputs.attempt }}" \
            "${{ github.event.workflow_run.id }}"
          "$T/report-usage.sh" "$pr" "${RUNNER_TEMP}/smallhours-result.json" auto_fix
      - name: Upload give-up diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smallhours-auto-fix-result
          path: ${{ runner.temp }}/smallhours-result.json*
          if-no-files-found: ignore
          retention-days: 7

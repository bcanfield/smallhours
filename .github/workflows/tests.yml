name: Tests

# The toolkit's own gate. Until this existed, tests/*.sh ran only when a
# maintainer remembered to run them by hand — so the suites asserting that a
# consumer cannot flip `allowUnsandboxedCommands` or `filesystem.disabled` (the
# sandbox profile ADR 0001 rests on) could regress without anything noticing.
#
# Deliberately NOT named "CI": consumers set `ci_workflow` to the workflow the
# agent loop gates on, and a name collision here would be confusing to read even
# though this repo is not its own consumer.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every suite is pure logic — no network, no gh auth, no sudo — so this needs
# nothing beyond reading the code.
permissions:
  contents: read

jobs:
  tests:
    name: Shell test suites
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Pinned rather than taking whatever the runner image ships: versions.env
      # is the single source of truth for every tool the toolkit targets
      # (ADR 0004), and a yq that parses .smallhours.yml differently to the one
      # the agent job installs would make this gate a liar.
      - name: Load pinned versions
        run: grep -E '^[A-Z_][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"

      - name: Install pinned yq
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Versions
        run: |
          bash --version | head -1
          jq --version
          yq --version

      - name: Run test suites
        run: tests/run-all.sh

  # The one thing run-all.sh structurally cannot check. Its suites are pure
  # logic by contract — no network, no sudo — and they prove the verify gate's
  # shell handling against fixtures we wrote. Whether a toolchain the AGENT
  # bootstrapped is visible to the gate is a fact about the runner image's own
  # startup files, and only a runner can answer it (ADR 0011).
  #
  # This is a standing guard, not a one-off measurement: a future runner image
  # that stops sourcing ~/.bashrc from ~/.profile, or ships a ~/.bash_profile,
  # would silently return every consumer to "the gate cannot see my toolchain"
  # — the failure #29 was filed for, whose first symptom was a wasted agent run.
  gate-environment:
    name: Verify gate sees an agent-bootstrapped toolchain
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Load pinned versions
        run: grep -E '^[A-Z_][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"

      - name: Install pinned yq
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      # Both idioms every ecosystem's installer uses, appended BELOW ~/.bashrc's
      # interactivity guard exactly where pnpm, bun, cargo, nvm and sdkman put
      # theirs. Nothing here is node-specific: one is a PATH entry, the other a
      # shell function, and a fix that only handled the first would quietly
      # exclude every function-based version manager.
      - name: Bootstrap a toolchain the way an agent would
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/probe/bin"
          printf '#!/bin/sh\necho path-tool ran\n' > "$HOME/.local/probe/bin/probe-path-tool"
          chmod +x "$HOME/.local/probe/bin/probe-path-tool"
          cat >> "$HOME/.bashrc" <<'EOF'

          # probe (smallhours gate-environment)
          export PROBE_HOME="$HOME/.local/probe"
          case ":$PATH:" in
            *":$PROBE_HOME/bin:"*) ;;
            *) export PATH="$PROBE_HOME/bin:$PATH" ;;
          esac
          probe_fn_tool() { echo "fn-tool ran"; }
          EOF

      # The other direction, and the hazard `-l` brings (ADR 0011's table, last
      # column): an entry the JOB ENVIRONMENT put on PATH, exactly how
      # claude-run.sh installs `claude` itself. A login shell sources
      # /etc/profile, which on Debian and Ubuntu ASSIGNS PATH rather than
      # extending it — so the gate could lose what a bare `bash -c` would have
      # kept, taking `npx` and `corepack` with it and breaking the remedy
      # GETTING-STARTED documents. It survives on this image; only a runner can
      # say that of the next one.
      - name: Put a tool on PATH the way the job environment does
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/jobenv/bin"
          printf '#!/bin/sh\necho jobenv-tool ran\n' > "$HOME/.local/jobenv/bin/probe-jobenv-tool"
          chmod +x "$HOME/.local/jobenv/bin/probe-jobenv-tool"
          echo "$HOME/.local/jobenv/bin" >> "$GITHUB_PATH"

      # Evidence for the log, whatever the assertions do — and the table in
      # ADR 0011 is only as good as its last run here.
      #
      # Two rows carry the argument. `bash -lc` is the obvious one-word fix and
      # the one #29 proposed: it resolves NOTHING, because ~/.bashrc returns at
      # its first line when non-interactive, above where every installer
      # appends. And bare `bash -lic` resolves nothing EITHER on this image —
      # the runner user has a ~/.bash_profile, which shadows the ~/.profile that
      # would otherwise have sourced ~/.bashrc. Only the last row, which is what
      # the gate actually runs, works. Delete the explicit source and the gate
      # silently goes back to seeing nothing.
      - name: Record what each shell form resolves
        run: |
          set -uo pipefail
          probe='command -v probe-path-tool >/dev/null && echo yes || echo no'
          fnprobe='type -t probe_fn_tool >/dev/null 2>&1 && echo yes || echo no'
          src='[ -r "$HOME/.bashrc" ] && . "$HOME/.bashrc" || true; '
          for form in "-c" "-lc" "-ic" "-lic"; do
            p="$(bash $form "$probe" 2>/dev/null)"
            f="$(bash $form "$fnprobe" 2>/dev/null)"
            printf 'bash %-5s              PATH entry: %-3s  shell function: %s\n' "$form" "$p" "$f"
          done
          p="$(bash -lic "$src$probe" 2>/dev/null)"
          f="$(bash -lic "$src$fnprobe" 2>/dev/null)"
          printf 'bash -lic + . ~/.bashrc  PATH entry: %-3s  shell function: %s   <- what the gate runs\n' "$p" "$f"

          # Third column of the ADR 0011 table: does an entry the job env put on
          # PATH survive /etc/profile's assignment under `-l`?
          jobenv='command -v probe-jobenv-tool >/dev/null && echo yes || echo no'
          printf '\ninherited job-env PATH entry — bash -c: %s   gate form: %s\n' \
            "$(bash -c "$jobenv" 2>/dev/null)" "$(bash -lic "$src$jobenv" 2>/dev/null)"
          printf '\ncommand_not_found_handle defined in an interactive shell: %s\n' \
            "$(bash -ic 'type -t command_not_found_handle || echo no' 2>/dev/null)"

      - name: The gate must see both, and must say so when it sees neither
        env:
          # A stub `claude`, so a FAILED classification shows up as "it
          # re-entered" instead of killing the step on a missing OAuth token.
          # The first run of this job died that way and reported nothing about
          # the actual defect.
          CLAUDE_CODE_OAUTH_TOKEN: stub-not-a-real-token
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stub-bin"
          cat > "$RUNNER_TEMP/stub-bin/claude" <<'STUB'
          #!/usr/bin/env bash
          echo "RE-ENTERED" >> "$RUNNER_TEMP/reentries"
          cat > /dev/null
          printf '%s\n' '{"type":"result","subtype":"success","is_error":false,"num_turns":1}'
          STUB
          chmod +x "$RUNNER_TEMP/stub-bin/claude"
          export PATH="$RUNNER_TEMP/stub-bin:$PATH"
          : > "$RUNNER_TEMP/reentries"

          . scripts/lib/verify.sh

          # Keeps each probe's log as well as its variables: the diagnostic
          # (ADR 0012) says nothing through SH_VERIFY_*, and one of its lines is
          # an assertion below.
          probe() { # name config-body -> sets FAILED / UNRESOLVED, writes probe-$1.err
            printf '%s\n' "$2" > "$RUNNER_TEMP/probe.yml"
            SMALLHOURS_CONFIG="$RUNNER_TEMP/probe.yml" \
              verify_gate "$RUNNER_TEMP/probe-$1.json" 2> "$RUNNER_TEMP/probe-$1.err" || true
            cat "$RUNNER_TEMP/probe-$1.err" >&2
          }
          rc=0

          probe path 'version: 1
          verify: "probe-path-tool"
          verify_reentries: 0'
          if [ -n "$SH_VERIFY_FAILED" ]; then
            echo "::error::a PATH entry added by ~/.bashrc is invisible to the verify gate"
            echo "$SH_VERIFY_FAILED"; rc=1
          else
            echo "ok: PATH entry from ~/.bashrc resolves"
          fi

          probe fn 'version: 1
          verify: "probe_fn_tool"
          verify_reentries: 0'
          if [ -n "$SH_VERIFY_FAILED" ]; then
            echo "::error::a shell function defined in ~/.bashrc is invisible to the verify gate"
            echo "$SH_VERIFY_FAILED"; rc=1
          else
            echo "ok: shell function from ~/.bashrc resolves"
          fi

          # ADR 0014, and the reason this job exists at all: everything else on
          # PATH is unwritable inside the sandbox, so the tool directory is the
          # only place an agent-installed tool can outlive its own process. If
          # the gate cannot see what is in it, the mechanism is decorative.
          #
          # A login shell REBUILDS PATH rather than inheriting it — macOS's
          # /etc/profile runs path_helper, Debian's assigns it outright — so this
          # is also the check that the prepend happens late enough to survive.
          mkdir -p "$SMALLHOURS_TOOL_BIN"
          printf '#!/bin/sh\necho agent-tool ran\n' > "$SMALLHOURS_TOOL_BIN/probe-agent-tool"
          chmod +x "$SMALLHOURS_TOOL_BIN/probe-agent-tool"
          probe toolbin 'version: 1
          verify: "probe-agent-tool"
          verify_reentries: 0'
          if [ -n "$SH_VERIFY_FAILED" ]; then
            echo "::error::a tool in \$SMALLHOURS_TOOL_BIN is invisible to the gate — ADR 0014's mechanism does not work on this image"
            echo "$SH_VERIFY_FAILED"; rc=1
          else
            echo "ok: a tool installed in the tool directory resolves"
          fi

          # The property `corepack pnpm run verify` lacked, which cost a consumer
          # run before anyone knew to look for it: PATH must be EXPORTED, so a
          # command that re-invokes a tool by name resolves it too. Repos whose
          # verify script calls its own package manager are the normal case.
          printf '#!/bin/sh\nprobe-agent-tool\n' > "$SMALLHOURS_TOOL_BIN/probe-wrapper-tool"
          chmod +x "$SMALLHOURS_TOOL_BIN/probe-wrapper-tool"
          probe toolnested 'version: 1
          verify: "probe-wrapper-tool"
          verify_reentries: 0'
          if [ -n "$SH_VERIFY_FAILED" ]; then
            echo "::error::a script in the tool directory cannot re-invoke another tool there — children are not inheriting PATH"
            echo "$SH_VERIFY_FAILED"; rc=1
          else
            echo "ok: a script in the tool directory can re-invoke another by name"
          fi

          # The gate must not LOSE what a plainer shell would have kept. Nothing
          # asserted this until #29's remedy — invoke through a launcher the
          # runner always has — made an inherited PATH the thing that remedy
          # stands on.
          probe jobenv 'version: 1
          verify: "probe-jobenv-tool"
          verify_reentries: 0'
          if [ -n "$SH_VERIFY_FAILED" ]; then
            echo "::error::the gate's login shell dropped a PATH entry the job environment set — /etc/profile is assigning PATH on this image"
            echo "$SH_VERIFY_FAILED"; rc=1
          else
            echo "ok: a PATH entry inherited from the job environment survives"
          fi

          # Layer 2 on a real runner: an unresolvable command must be reported as
          # "the gate could not run" and must NOT burn a Claude re-entry.
          probe missing 'version: 1
          verify: "probe-definitely-absent-tool"
          verify_reentries: 2'
          if [ "$SH_VERIFY_UNRESOLVED" = "probe-definitely-absent-tool" ]; then
            echo "ok: an unresolvable command is classified as could-not-run"
          else
            echo "::error::unresolvable command was not classified (SH_VERIFY_UNRESOLVED='$SH_VERIFY_UNRESOLVED')"
            # The classification parses one message, so when it misses, the
            # message is the diagnosis. Print it rather than making the next
            # person re-run this to find out.
            echo "--- what the gate actually captured ---"
            printf '%s\n' "$SH_VERIFY_FAILED"
            echo "--- command_not_found_handle: $(bash -ic 'type -t command_not_found_handle || echo undefined' 2>/dev/null) ---"
            rc=1
          fi
          # The diagnostic's on-disk probe is what tells "the tool is here and we
          # could not reach it" from "it was never here", and it only gets to say
          # that if it FINISHES. This runner is bare; a consumer's carries a
          # populated package store, so a budget that is already tight here has
          # no chance there. Both previous versions of this probe failed exactly
          # this way — the first cut off at 8s, the second finished with 3s to
          # spare — and neither could have been caught by a fixture.
          if grep -q "on disk: INCONCLUSIVE" "$RUNNER_TEMP/probe-missing.err"; then
            echo "::error::the on-disk probe ran out of time on a BARE runner; it can no longer tell 'unreachable' from 'never existed' (ADR 0012)"
            grep "diagnose:" "$RUNNER_TEMP/probe-missing.err" || true
            rc=1
          else
            echo "ok: the on-disk probe finished inside its budget"
          fi

          if [ -s "$RUNNER_TEMP/reentries" ]; then
            echo "::error::the gate re-entered on an environment fault — that is the wasted stage #29 exists to stop"
            rc=1
          else
            echo "ok: no Claude re-entry was spent"
          fi

          exit "$rc"

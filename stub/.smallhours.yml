# smallhours consumer config. Every key is OPTIONAL — delete any line to take
# the default shown. setup-repo.sh drops this into a new consumer repo alongside
# the stub workflow. Defaults live in scripts/lib/config.sh.
#
# Comments stay on their own lines so this passes strict YAML linters as-is.
version: 1

# Per-stage Claude model. Default: claude-sonnet-5 for every stage.
models:
  implement: claude-sonnet-5
  address_review: claude-sonnet-5
  auto_fix: claude-sonnet-5
  resolve_conflict: claude-sonnet-5

# Per-stage --max-turns ceiling.
max_turns:
  implement: 50
  address_review: 30
  auto_fix: 25
  resolve_conflict: 20

# Consecutive CI auto-fix attempts before giving up (0 disables auto-fix:
# the first red hands straight off to a human). Default: 3.
attempt_cap: 3

# Max issues worked at once. ready-for-agent is an unbounded queue; the
# dispatcher keeps at most this many in agent-working, promoting the rest as
# slots free. Default: 3.
max_concurrent: 3

# Name of the consumer CI workflow the state machine gates on. Must match the
# workflows entry in the stub's workflow_run trigger. Default: ci.
ci_workflow: ci

# Map canonical label names (CONTEXT.md vocabulary) to this repo's own label
# strings, for repos with a pre-existing label scheme. Keys are canonical
# names; values are what actually appears on issues/PRs. Unmapped names use
# the canonical string. The workflow-trigger labels — ready-for-agent,
# agent-working, and the PR marker agent — are FIXED in v1 and cannot be
# remapped (the reusable workflow gates on them before config is readable).
# Example:
#   labels:
#     in-review: "status: in review"
#     ready-for-human: "status: needs human"
labels: {}

# Extra domains appended to the sandbox egress allowlist (GitHub + Anthropic are
# always allowed). Default: none.
egress_extra_domains: []

# When true, the sandbox reaches registry.npmjs.org AND install lifecycle
# scripts are disabled (NPM_CONFIG_IGNORE_SCRIPTS=true). When false (default),
# npm has no network egress.
#
# Egress alone is not enough to INSTALL anything: the sandbox permits writes to
# the working directory and $TMPDIR only, and a package store lives outside both.
# Pair this with sandbox.filesystem.allowWrite below, or resolution will succeed
# and the store write will be denied.
npm_allowed: false

# Widen the sandbox Claude Code runs your agent under. Every key here is a LIST
# and is APPENDED to the toolkit's hardened profile — you can add paths, domains
# and commands, but you cannot turn a protection off. `enabled`,
# `failIfUnavailable`, `allowUnsandboxedCommands`, `allowManagedDomainsOnly`,
# `filesystem.disabled`, `enableWeakerNestedSandbox` and the Unix-socket keys
# belong to the toolkit; setting one here logs a warning and is ignored.
#
# Settable keys: filesystem.allowWrite, filesystem.allowRead,
# filesystem.denyWrite, filesystem.denyRead, excludedCommands,
# credentials.files, credentials.envVars, network.allowedDomains.
# Full reference: https://code.claude.com/docs/en/settings#sandbox-settings
#
# The usual reason to set this is a package manager's store, which lives outside
# the working directory. Paths are ecosystem-specific, so the toolkit does not
# guess them — e.g. pnpm/npm:
#   sandbox:
#     filesystem:
#       allowWrite: ["~/.local/share/pnpm", "~/.npm", "~/.cache"]
# and for a tool that cannot run sandboxed at all:
#     excludedCommands: ["docker *"]
sandbox: {}

# The VERIFY GATE: run after the agent finishes and before the pull request
# opens. Any shell command; the toolkit only reads its exit status. On failure it
# re-enters the agent with the output (see verify_reentries) so a lint or type
# error costs seconds here instead of a full CI round trip plus one of your
# attempt_cap auto-fix attempts.
#
# It can never stall an issue: a gate still failing after its re-entries pushes
# anyway and says so on the PR, leaving CI exactly the backstop it already was.
# Unset (default) means no gate — the behaviour before this key existed.
#
# The agent must be able to RUN this, which for most repos means it has to
# install dependencies first. Tell it so in AGENTS.md / CLAUDE.md.
# verify: pnpm verify

# How many times a red gate re-enters the agent before the branch is pushed
# regardless. Distinct from attempt_cap, which counts CI auto-fix attempts across
# jobs; this counts re-entries inside one. 0 runs the gate but never re-enters.
# Default: 2.
verify_reentries: 2
